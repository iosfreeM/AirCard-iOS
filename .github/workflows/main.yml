name: Build iOS App on macOS 15 Intel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build on macOS 15 Intel
    runs-on: macos-15-intel

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install Dependencies
      run: |
        brew install xcodegen rust

    - name: Generate Xcode Project
      run: |
        xcodegen generate

    - name: Build Project
      run: |
        # Выведет список всех доступных схем в лог для проверки
        xcodebuild -list -project AirCard-iOS.xcodeproj
        
        # Сборка с правильной схемой AirCard-iOS
        xcodebuild -project AirCard-iOS.xcodeproj -scheme AirCard-iOS -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
