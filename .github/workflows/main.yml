name: Build iOS App on macOS 15 Intel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build on macOS 15 Intel
    runs-on: macos-15-intel

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Fix Xcode Developer Directory
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
        echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> $GITHUB_ENV

    - name: Install Dependencies
      run: |
        brew install xcodegen rust
        rustup target add aarch64-apple-ios-sim x86_64-apple-ios

    - name: Build Rust Core & Dependencies
      run: |
        if [ -f "build-ios.sh" ]; then
          chmod +x build-ios.sh
          ./build-ios.sh
        elif [ -f "ios-app/build-ios.sh" ]; then
          cd ios-app && chmod +x build-ios.sh && ./build-ios.sh && cd ..
        else
          if [ -f "Cargo.toml" ]; then
            cargo build --target x86_64-apple-ios
          elif [ -f "ios-app/Cargo.toml" ]; then
            cd ios-app && cargo build --target x86_64-apple-ios && cd ..
          fi
        fi

    - name: Generate Xcode Project
      run: |
        xcodegen generate

    - name: Resolve Swift Packages
      run: |
        xcodebuild -resolvePackageDependencies \
          -project AirCard-iOS.xcodeproj \
          -scheme AirCard-iOS

    - name: Build Project
      run: |
        xcodebuild clean build \
          -project AirCard-iOS.xcodeproj \
          -scheme AirCard-iOS \
          -sdk iphonesimulator \
          -destination "generic/platform=iOS Simulator" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
